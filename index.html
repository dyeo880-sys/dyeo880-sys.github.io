<style>
html,body{height:100%;margin:0}
body{background:#0a0614;color:#fff;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
.fx{position:fixed;inset:0}
#sky{background:linear-gradient(180deg,#03020c,#0a0f33 55%,#1b1b52)}
#wx{background:transparent;transition:background 1s}
#flash{background:#fff;opacity:0;transition:opacity .5s;pointer-events:none}
.vig{background:radial-gradient(ellipse at 50% 52%,#0000004d 0,transparent 70%),linear-gradient(transparent 60%,#0000004d)}
canvas.fx{width:100%;height:100%}
.orb{position:fixed;width:min(22vw,110px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);transition:opacity 1s}
.orb.sun{background:radial-gradient(circle,#fffbe0,#ffd75e 50%,#ffb347);box-shadow:0 0 70px 24px #ffd27a88}
.orb.moon{background:radial-gradient(circle at 36% 34%,#fffdf0,#e8e6d0 60%,#bdb9a0);box-shadow:0 0 55px 16px #cfd8ff55}
.clouds{position:fixed;inset:0;overflow:hidden;transition:opacity 1s}
.cl{position:absolute;left:-320px;width:240px;height:64px;border-radius:40px;background:#fff;animation:cl 80s linear infinite}
.cl:before,.cl:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cl:before{width:100px;height:100px;left:30px;top:-48px}
.cl:after{width:76px;height:76px;right:34px;top:-34px}
.clouds.dark .cl{background:#7d879b}
@keyframes cl{to{transform:translateX(calc(100vw + 700px))}}
.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;box-sizing:border-box;text-shadow:0 2px 10px #0008}
.logo{width:min(40vw,160px);height:auto}
.wave{transform-origin:60px 56px;animation:pulse 2s ease-out infinite;opacity:0}
.w2{animation-delay:.7s}.w3{animation-delay:1.4s}
@keyframes pulse{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.4)}}
h1{margin:0;font-size:clamp(36px,9vw,70px);letter-spacing:.16em;font-weight:900;
  background:linear-gradient(90deg,#fff,#ffd98f,#ffb3d1);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 8px #0009)}
.sub{margin:-8px 0 0;font-size:clamp(13px,3.4vw,17px);letter-spacing:.5em;opacity:.9}
.tag{font-size:clamp(13px,3.4vw,16px);padding:6px 16px;border-radius:20px;background:#00000040;border:1px solid #ffffff33}
.eq{display:flex;align-items:flex-end;gap:5px;height:40px}
.eq i{width:6px;height:100%;border-radius:3px;background:linear-gradient(#38e8ff,#ff4fa3);transform-origin:bottom;transform:scaleY(.2);animation:bar 1s ease-in-out infinite alternate}
@keyframes bar{to{transform:scaleY(1)}}
.conn{font-size:clamp(20px,5vw,28px);font-weight:700}
.dots span{opacity:.2;animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{40%{opacity:1}}
.bar{width:min(78vw,360px);height:8px;border-radius:8px;background:#ffffff33;overflow:hidden}
.bar b{display:block;width:100%;height:100%;background:linear-gradient(90deg,#38e8ff,#8b5cf6,#ff4fa3,#ffcf7a);transform-origin:left;transform:scaleX(0);animation:load 3.3s linear forwards}
@keyframes load{to{transform:scaleX(1)}}
.hint{font-size:12px;opacity:.75}
.intro{max-width:460px;margin:0;font-size:12px;line-height:1.6;opacity:.65}
@media (prefers-reduced-motion:reduce){.cl,.wave,.eq i,.dots span{animation:none!important}}
</style>

<body>
<div class="fx" id="sky"></div>
<div class="orb" id="orb"></div>
<div class="clouds" id="clouds"><div class="cl" style="top:12%"></div><div class="cl" style="top:30%;animation-delay:-35s;transform:scale(.8)"></div><div class="cl" style="top:48%;animation-delay:-60s;transform:scale(1.2)"></div></div>
<canvas class="fx" id="cv"></canvas>

<main class="stage">
  <svg class="logo" viewBox="0 0 120 100" aria-hidden="true">
    <g fill="none" stroke="#ffcf7a" stroke-width="2.5">
      <circle class="wave" cx="60" cy="56" r="40"/><circle class="wave w2" cx="60" cy="56" r="40"/><circle class="wave w3" cx="60" cy="56" r="40"/>
    </g>
    <line x1="38" y1="30" x2="86" y2="8" stroke="#ffcf7a" stroke-width="4" stroke-linecap="round"/>
    <rect x="14" y="30" width="92" height="60" rx="12" fill="#b99a5b" stroke="#3b2417" stroke-width="3"/>
    <rect x="20" y="36" width="80" height="48" rx="8" fill="#5a3822"/>
    <circle cx="44" cy="60" r="18" fill="#2a1a08" stroke="#ffcf7a" stroke-width="2"/>
    <circle cx="44" cy="60" r="8" fill="#ffcf7a"/>
    <rect x="70" y="46" width="24" height="5" rx="2.5" fill="#ffcf7a"/>
    <rect x="70" y="58" width="24" height="5" rx="2.5" fill="#ffcf7a"/>
    <rect x="70" y="70" width="24" height="5" rx="2.5" fill="#ffcf7a"/>
  </svg>
  <h1>RADIOLA</h1>
  <p class="sub">웹 라디오</p>
  <div class="tag" id="tag"></div>
  <div class="eq" id="eq" aria-hidden="true"></div>
  <div class="conn" role="status">연결중입니다<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>

  <div class="hint">잠시만 기다려 주세요 · 자동으로 연결됩니다</div>
  <p class="intro">Radiola 웹 라디오 · 한국 라디오와 전 세계 FM 라디오·TV를 설치 없이 무료로 듣고, 음악 방에서 함께 듣고 채팅·신청곡·노래방까지 즐기세요.</p>

<noscript><p style="text-align:center"><a style="color:#ffcf7a" href="https://dyeo880-sys.github.io/01042731972/">Radiola 바로 가기</a></p></noscript>

<script>
(function(){
var TARGET="https://dyeo880-sys.github.io/01042731972/";
var $=function(i){return document.getElementById(i)},R=Math.random,Q=new URLSearchParams(location.search);

/* 한국 시간(KST) 기준 시각·계절 — 미리보기: ?t=23 &m=10 &w=rain|snow|storm|cloud|fog|clear */
var n=new Date(Date.now()+new Date().getTimezoneOffset()*6e4+324e5);
var H=Q.has("t")?+Q.get("t"):n.getHours()+n.getMinutes()/60;
var M=Q.has("m")?+Q.get("m"):n.getMonth()+1;
var S=M>=3&&M<=5?"spring":M>=6&&M<=8?"summer":M>=9&&M<=11?"autumn":"winter";
var PH=H>=5&&H<7?"dawn":H>=7&&H<11?"morning":H>=11&&H<16?"noon":H>=16&&H<19?"sunset":H>=19&&H<21?"evening":"night";
var SKY={dawn:["#2b2d6e","#c76b8f","#ffc89b"],morning:["#3d8fe8","#7fc4f5","#d4efff"],noon:["#1f6fd1","#4aa3ee","#9ad6ff"],
  sunset:["#2e2a6b","#d9566a","#ffb25e"],evening:["#140f40","#43317f","#c2528f"],night:["#03020c","#0a0f33","#1b1b52"]};
var PHK={dawn:"새벽",morning:"아침",noon:"한낮",sunset:"해질녘",evening:"저녁",night:"밤"};
var SK={spring:"🌸 봄",summer:"🌿 여름",autumn:"🍂 가을",winter:"❄️ 겨울"};
var WK={clear:"맑은 하늘",cloud:"흐린 하늘",fog:"안개 낀 하늘",rain:"비 오는 날",snow:"눈 오는 날",storm:"천둥번개"};
var OV={clear:"transparent",cloud:"rgba(80,90,110,.3)",fog:"rgba(200,205,215,.38)",rain:"rgba(35,45,65,.55)",storm:"rgba(20,25,45,.65)",snow:"rgba(210,225,245,.22)"};
var starry=PH==="night"||PH==="evening"||PH==="dawn", dark=PH==="night"||PH==="evening";
var WX=Q.get("w")||"clear";

/* 캔버스 (입자 수 제한 · 30fps · 화면 숨김 시 정지) */
var cv=$("cv"),cx=cv.getContext("2d"),D=Math.min(window.devicePixelRatio||1,1.5),W,Hh,P=[],shoot=null;
function size(){W=cv.width=innerWidth*D|0;Hh=cv.height=innerHeight*D|0}
size();addEventListener("resize",size);
function pick(a){return a[R()*a.length|0]}
function add(k,c,f){var s=Math.min(1,innerWidth*innerHeight/800000)*.6+.4;for(var i=0;i<(c*s|0);i++){var p=f();p.k=k;p.x=R()*W;p.y=R()*Hh;p.ph=R()*6.28;P.push(p)}}
function build(){
  P=[];var wet=WX==="rain"||WX==="storm"||WX==="snow",h=wet?.5:1;
  if(starry&&!wet)add("star",WX==="cloud"||WX==="fog"?30:90,function(){return{r:(.6+R()*1.6)*D,v:.5+R()*1.5,c:pick(["#fff","#cfe3ff","#fff3c4"])}});
  if(S==="autumn")add("leaf",26*h,function(){return{r:(6+R()*8)*D,v:(40+R()*50)*D,rot:R()*6.28,vr:(R()-.5)*3,c:pick(["#e8590c","#f08c00","#c92a2a","#d9480f","#b7791f"]),q:.55}});
  if(S==="spring")add("leaf",30*h,function(){return{r:(4+R()*4)*D,v:(25+R()*35)*D,rot:R()*6.28,vr:(R()-.5)*2.5,c:pick(["#ffc2d9","#ffd6e5","#fff0f5"]),q:.65}});
  if(S==="summer"&&dark&&!wet)add("fly",22,function(){return{r:(1.5+R()*1.5)*D}});
  if(WX==="snow")add("snow",90,function(){return{r:(1.5+R()*3)*D,v:(25+R()*45)*D}});
  if(WX==="rain"||WX==="storm")add("rain",120,function(){return{l:(14+R()*18)*D,v:(520+R()*280)*D}});
}
var last=0;
function draw(t,dt){
  cx.clearRect(0,0,W,Hh);var rain=false;
  for(var i=0;i<P.length;i++){var p=P[i];
    if(p.k==="star"){cx.globalAlpha=.3+.7*Math.abs(Math.sin(t/900*p.v+p.ph));cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();
      if(p.r>1.7*D){cx.strokeStyle=p.c;cx.lineWidth=D*.7;cx.beginPath();cx.moveTo(p.x-p.r*3,p.y);cx.lineTo(p.x+p.r*3,p.y);cx.moveTo(p.x,p.y-p.r*3);cx.lineTo(p.x,p.y+p.r*3);cx.stroke()}}
    else if(p.k==="leaf"||p.k==="snow"){
      p.y+=p.v*dt;p.x+=Math.sin(t/700+p.ph)*28*D*dt+(p.k==="leaf"?12*D*dt:0);if(p.k==="leaf")p.rot+=p.vr*dt;
      if(p.y>Hh+20){p.y=-20;p.x=R()*W}if(p.x>W+20)p.x=-20;
      cx.fillStyle=p.k==="snow"?"#fff":p.c;cx.globalAlpha=p.k==="snow"?.85:.92;cx.beginPath();
      if(p.k==="snow")cx.arc(p.x,p.y,p.r,0,6.283);else cx.ellipse(p.x,p.y,p.r,p.r*p.q,p.rot,0,6.283);cx.fill()}
    else if(p.k==="fly"){p.x+=Math.cos(t/2000+p.ph)*14*D*dt;p.y+=Math.sin(t/2300+p.ph)*12*D*dt;var a=.2+.8*Math.abs(Math.sin(t/700+p.ph));
      cx.fillStyle="#dcff78";cx.globalAlpha=a*.18;cx.beginPath();cx.arc(p.x,p.y,p.r*4,0,6.283);cx.fill();cx.globalAlpha=a;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}
    else if(p.k==="rain"){rain=true;p.y+=p.v*dt;p.x-=p.v*.18*dt;if(p.y>Hh){p.y=-30;p.x=R()*W*1.2}}}
  if(rain){cx.globalAlpha=.5;cx.strokeStyle="#bed7ff";cx.lineWidth=D;cx.beginPath();
    for(i=0;i<P.length;i++){p=P[i];if(p.k==="rain"){cx.moveTo(p.x,p.y);cx.lineTo(p.x-p.l*.18,p.y+p.l)}}cx.stroke()}
  if(starry&&PH==="night"&&WX==="clear"){ /* 별똥별 */
    if(!shoot&&R()<.006)shoot={x:W*(.3+R()*.6),y:Hh*R()*.3,life:1};
    if(shoot){shoot.x-=W*.8*dt;shoot.y+=Hh*.35*dt;shoot.life-=dt*1.3;cx.globalAlpha=Math.max(shoot.life,0);cx.strokeStyle="#fff";cx.lineWidth=2*D;
      cx.beginPath();cx.moveTo(shoot.x,shoot.y);cx.lineTo(shoot.x+W*.13,shoot.y-Hh*.06);cx.stroke();if(shoot.life<=0)shoot=null}}
}
function loop(t){requestAnimationFrame(loop);if(document.hidden||t-last<33)return;var dt=Math.min((t-last)/1000,.06);last=t;draw(t,dt)}

/* 장면 적용 */
var thunder=null;
function render(){
  var c=SKY[PH];$("sky").style.background="linear-gradient(180deg,"+c[0]+","+c[1]+" 55%,"+c[2]+")";
  $("wx").style.background=OV[WX]||"transparent";
  var day=H>=6&&H<18,p=day?(H-6)/12:((H-18+24)%24)/12,o=$("orb"),wet=WX==="rain"||WX==="storm"||WX==="snow";
  o.className="orb "+(day?"sun":"moon");o.style.left=(8+84*p)+"%";o.style.top=(62-52*Math.sin(Math.PI*p))+"%";
  o.style.opacity=wet?.15:WX==="cloud"||WX==="fog"?.45:1;
  var cl=$("clouds");cl.style.opacity=dark?(wet||WX==="cloud"?.35:.08):(wet||WX==="cloud"?.85:.5);cl.className="clouds"+(wet?" dark":"");
  $("tag").textContent=SK[S]+" "+PHK[PH]+" · "+(WK[WX]||WK.clear);
  build();
  clearTimeout(thunder);if(WX==="storm")(function f(){thunder=setTimeout(function(){var e=$("flash");e.style.transition="none";e.style.opacity=".7";
    setTimeout(function(){e.style.transition="opacity .5s";e.style.opacity="0"},60);f()},4000+R()*5000)})();
}
render();
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)requestAnimationFrame(loop);else draw(0,0);

/* 오늘 날씨(서울 기준, Open-Meteo 무료) — 1.5초 내 못 받으면 맑음으로 진행 */
function code2(c){return c>=95?"storm":c>=71&&c<=77||c===85||c===86?"snow":c>=51&&c<=67||c>=80&&c<=82?"rain":c===45||c===48?"fog":c===3?"cloud":"clear"}
if(!Q.has("w")){
  var ck=null;try{ck=JSON.parse(localStorage.getItem("rw")||"null")}catch(e){}
  if(ck&&Date.now()-ck.t<12e5){WX=ck.w;render()}
  else try{var ac=new AbortController(),to=setTimeout(function(){ac.abort()},1500);
    fetch("https://api.open-meteo.com/v1/forecast?latitude=37.57&longitude=126.98&current=weather_code",{signal:ac.signal})
    .then(function(r){return r.json()}).then(function(j){clearTimeout(to);WX=code2(j.current.weather_code);
      try{localStorage.setItem("rw",JSON.stringify({t:Date.now(),w:WX}))}catch(e){}render()}).catch(function(){})}catch(e){}
}

var eq=$("eq");for(var i=0;i<14;i++){var b=document.createElement("i");b.style.animationDuration=(.5+R()*.8).toFixed(2)+"s";b.style.animationDelay=(-R()).toFixed(2)+"s";eq.appendChild(b)}
if(!Q.has("stay"))setTimeout(function(){location.replace(TARGET)},3500);
})();
</script>
</body>
