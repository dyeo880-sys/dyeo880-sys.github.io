<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radiola 웹 라디오 - 연결중입니다</title>
<meta name="description" content="Radiola 웹 라디오에 연결 중입니다.">
<meta http-equiv="refresh" content="8;url=https://dyeo880-sys.github.io/01042731972/">
<style>
:root{--bg:#07040f;--amber:#ffcf7a;--pink:#ff4fa3;--cyan:#38e8ff;--violet:#8b5cf6;--ink:#fff4dc}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
/* 오로라 배경 */
.aurora{position:fixed;inset:-20%;filter:blur(60px) saturate(1.4);opacity:.85;
  background:
   radial-gradient(40% 40% at 20% 30%,var(--violet),transparent 70%),
   radial-gradient(35% 35% at 80% 25%,var(--pink),transparent 70%),
   radial-gradient(40% 40% at 70% 80%,var(--cyan),transparent 70%),
   radial-gradient(35% 35% at 25% 80%,#ff9a3c,transparent 70%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:rotate(25deg) scale(1.15)}}
canvas{position:fixed;inset:0;width:100%;height:100%}
.vignette{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 30%,#07040fcc 100%)}
.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:20px;
  transition:opacity .6s,transform .6s}
.stage.out{opacity:0;transform:scale(1.08)}
/* 라디오 로고 */
.logo{width:min(46vw,200px);filter:drop-shadow(0 0 28px #ffb54dcc) drop-shadow(0 0 60px #ff4fa388);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.wave{transform-origin:center;animation:pulse 1.6s ease-out infinite;opacity:0}
.wave.w2{animation-delay:.5s}.wave.w3{animation-delay:1s}
@keyframes pulse{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
h1{margin:0;font-size:clamp(38px,9vw,76px);letter-spacing:.18em;font-weight:900;
  background:linear-gradient(90deg,var(--amber),var(--pink),var(--cyan),var(--amber));background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;
  filter:drop-shadow(0 0 18px #ff4fa366)}
@keyframes shine{to{background-position:300% 0}}
.sub{margin:-10px 0 0;font-size:clamp(13px,3.4vw,18px);letter-spacing:.5em;opacity:.8}
/* 이퀄라이저 */
.eq{display:flex;align-items:flex-end;gap:5px;height:56px}
.eq i{width:7px;border-radius:4px;background:linear-gradient(var(--cyan),var(--pink));box-shadow:0 0 10px var(--pink);
  height:20%;animation:bar 1s ease-in-out infinite alternate}
@keyframes bar{to{height:100%}}
/* 연결중 */
.conn{font-size:clamp(20px,5vw,30px);font-weight:700;text-shadow:0 0 14px var(--cyan)}
.dots span{animation:blink 1.2s infinite;opacity:.2}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{40%{opacity:1}}
.bar{width:min(78vw,380px);height:8px;border-radius:8px;background:#ffffff1f;overflow:hidden;box-shadow:0 0 18px #38e8ff55}
.bar b{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink),var(--amber));
  box-shadow:0 0 14px var(--pink);animation:load 2.8s cubic-bezier(.4,.1,.3,1) forwards}
@keyframes load{to{width:100%}}
.hint{font-size:12px;opacity:.55}
@media (prefers-reduced-motion:reduce){.aurora,.logo,.eq i,h1{animation:none}}
</style>
</head>
<body>
<div class="aurora"></div>
<canvas id="fx"></canvas>
<div class="vignette"></div>

<main class="stage" id="stage">
  <svg class="logo" viewBox="0 0 120 100" aria-hidden="true">
    <g fill="none" stroke="#ffcf7a" stroke-width="2.5">
      <circle class="wave" cx="60" cy="56" r="40"/><circle class="wave w2" cx="60" cy="56" r="40"/><circle class="wave w3" cx="60" cy="56" r="40"/>
    </g>
    <line x1="38" y1="30" x2="86" y2="8" stroke="#ffcf7a" stroke-width="4" stroke-linecap="round"/>
    <rect x="14" y="30" width="92" height="60" rx="12" fill="#b99a5b" stroke="#3b2417" stroke-width="3"/>
    <rect x="20" y="36" width="80" height="48" rx="8" fill="#5a3822"/>
    <circle cx="44" cy="60" r="18" fill="#2a1a08" stroke="#ffcf7a" stroke-width="2"/>
    <circle cx="44" cy="60" r="8" fill="#ffcf7a"/>
    <rect x="70" y="46" width="24" height="5" rx="2.5" fill="#ffcf7a"/>
    <rect x="70" y="58" width="24" height="5" rx="2.5" fill="#ffcf7a"/>
    <rect x="70" y="70" width="24" height="5" rx="2.5" fill="#ffcf7a"/>
  </svg>

  <h1>RADIOLA</h1>
  <p class="sub">웹 라디오</p>

  <div class="eq" id="eq" aria-hidden="true"></div>

  <div class="conn" role="status" aria-live="polite">연결중입니다<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  <div class="bar"><b></b></div>
  <div class="hint">잠시만 기다려 주세요 · 자동으로 연결됩니다</div>
</main>

<noscript><p style="position:relative;z-index:3;text-align:center"><a style="color:#ffcf7a" href="https://dyeo880-sys.github.io/01042731972/">Radiola 바로 가기</a></p></noscript>

<script>
// ▼ 연결될 실제 라디오 페이지 주소 (바꿀 때는 여기만 수정)
var TARGET = "https://dyeo880-sys.github.io/01042731972/";
var WAIT = 2900; // 연결중 표시 시간(ms)

// 이퀄라이저 막대
var eq = document.getElementById("eq");
for (var i = 0; i < 24; i++) {
  var b = document.createElement("i");
  b.style.animationDuration = (0.5 + Math.random() * 0.9).toFixed(2) + "s";
  b.style.animationDelay = (-Math.random()).toFixed(2) + "s";
  eq.appendChild(b);
}

// 반짝이는 입자 + 퍼지는 음파
var c = document.getElementById("fx"), x = c.getContext("2d"), W, H, P = [], R = [];
function size() {
  var d = window.devicePixelRatio || 1;
  W = c.width = innerWidth * d; H = c.height = innerHeight * d;
}
size(); addEventListener("resize", size);
var cols = ["#ffcf7a", "#ff4fa3", "#38e8ff", "#c4b5fd"];
for (var j = 0; j < 90; j++) P.push({
  x: Math.random(), y: Math.random(), r: Math.random() * 2.2 + .6,
  v: Math.random() * .0006 + .0002, c: cols[j % 4], t: Math.random() * 6
});
function frame(t) {
  x.clearRect(0, 0, W, H);
  x.globalCompositeOperation = "lighter";
  P.forEach(function (p) {
    p.y -= p.v; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
    var a = .4 + .6 * Math.abs(Math.sin(t / 700 + p.t));
    x.globalAlpha = a; x.fillStyle = p.c; x.shadowColor = p.c; x.shadowBlur = 12;
    x.beginPath(); x.arc(p.x * W, p.y * H, p.r * (W / 900 + 1), 0, 6.283); x.fill();
  });
  if (!R.length || t - R[R.length - 1].t0 > 700) R.push({ t0: t });
  R = R.filter(function (r) { return t - r.t0 < 3200; });
  x.shadowBlur = 0; x.lineWidth = 2;
  R.forEach(function (r, k) {
    var p = (t - r.t0) / 3200;
    x.globalAlpha = (1 - p) * .35; x.strokeStyle = cols[k % 4];
    x.beginPath(); x.arc(W / 2, H * .42, p * Math.max(W, H) * .7, 0, 6.283); x.stroke();
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 클릭 없이 자동 연결
if (location.search.indexOf("stay") === -1) {
  setTimeout(function () {
    document.getElementById("stage").classList.add("out");
    setTimeout(function () { location.replace(TARGET); }, 500);
  }, WAIT);
}
</script>
</body>
</html>
