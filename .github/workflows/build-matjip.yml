name: 맛집 게시판 검색용 페이지 만들기

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국시간 새벽 6시

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 게시판 글을 페이지로 만들기
        env:
          MATJIP_DATA_URL: ${{ vars.MATJIP_DATA_URL }}
        run: python tools/build_matjip.py

      - name: 바뀐 파일 저장하기
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "맛집 검색용 페이지 갱신"
            git push
          fi
